    <rect x="29" y="61" width="102" height="38" rx="11" fill="#ffffff" fill-opacity="0.95" stroke="#d7e3ec" stroke-width="2"/>
    <text x="80" y="88" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="31" font-weight="900" letter-spacing="2" fill="#0b4a7e">CEK</text>
